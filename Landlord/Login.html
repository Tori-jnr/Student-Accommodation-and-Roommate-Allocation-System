<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Authentication </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mod 1: Implemented the 'auth-page' split-screen layout utility -->
    <div class="auth-page">
        
        <!-- COLUMN 1: The Interactive Login Interface -->
        <main class="auth-panel">
            <!-- Mod 2: Wrapped entry forms inside the stylized elevation 'auth-card' container -->
            <div class="auth-card">
                
                <!-- Brand System Identifier -->
                <div class="brand" style="margin-bottom: 24px;">
                    <div class="brand-mark">RH</div>
                    <div>
                        <span>Rommly Hub</span>
                        
                    </div>
                </div>

                <h1>Login</h1>
                <!-- Core Form Fields (Pointing to your local portal page) -->
                <form action="landlord.html" method="GET" style="margin-top: 24px; display: grid; gap: 16px;">
                    
                    <!-- Mod 3: Integrated your rigid form framework (.field class helper) -->
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter email" required>
                    </div>

                    <div class="field">
                        <label for="password">Password Key</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>

                    <!-- Mod 4: Added a User Role option field to verify landlord/student segmentation -->
                    <div class="field">
                        <label for="role"></label>
                        <select id="role" required>
                            <option value="" disabled selected>Select User role</option>
                            <option value="landlord">Landlord</option>
                            <option value="student">Student</option>
                            <option value="admin">System Administrator</option>
                        </select>
                    </div>

                    <!-- Layout support for remember option mechanics -->
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin: 4px 0;">
                        <label style="display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--muted); cursor: pointer;">
                            
                    <!-- Mod 5: Wired up the primary functional trigger button with background interactions -->
                    <button type="submit" class="button">Login</button>
                </form>

                <div style="margin-top: 28px; text-align: center; font-size: 14px; color: var(--muted);">
                    Don't have an asset portal profile? <a href="#" style="color: var(--primary); font-weight: 700;">Register here</a>
                </div>
            </div>
        </main>

   
</body>
</html>
