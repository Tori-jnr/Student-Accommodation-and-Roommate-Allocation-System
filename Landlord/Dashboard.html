<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landlord Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Global Navigation Bar -->
    <header class="navbar">
        <div class="logo">Landlord Portal</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#" class="active">Dashboard</a>
            <a href="#">Logout</a>
        </div>
    </header>

    <!-- Three-Panel Wireframe Layout -->
    <div class="portal-grid">
        
        <!-- PANEL 1: Left Input/Profile Form -->
        <section class="panel panel-left">
            <h2>Account Details</h2>
            <form class="wireframe-form">
                <div class="input-block"></div>
                <div class="input-block"></div>
                <div class="input-block"></div>
                <div class="input-block large"></div>
                <button type="button" class="wireframe-btn">Save Changes</button>
            </form>
        </section>

        <!-- PANEL 2: Center Data Table / Listings -->
        <section class="panel panel-center">
            <h2>Overview Table</h2>
            <div class="wireframe-table">
                <div class="table-header">
                    <span>Header 1</span>
                    <span>Header 2</span>
                    <span>Header 3</span>
                </div>
                <div class="table-row"><span>Data A</span><span>Data B</span><span>Data C</span></div>
                <div class="table-row"><span>Data A</span><span>Data B</span><span>Data C</span></div>
                <div class="table-row"><span>Data A</span><span>Data B</span><span>Data C</span></div>
                <div class="table-row"><span>Data A</span><span>Data B</span><span>Data C</span></div>
            </div>
        </section>

        <!-- PANEL 3: Right Activity Stream / Cards -->
        <section class="panel panel-right">
            <h2>Recent Notifications</h2>
            <div class="card-stream">
                <div class="stream-card">
                    <div class="card-icon"></div>
                    <div class="card-text"></div>
                </div>
                <div class="stream-card">
                    <div class="card-icon"></div>
                    <div class="card-text"></div>
                </div>
                <div class="stream-card">
                    <div class="card-icon"></div>
                    <div class="card-text"></div>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
