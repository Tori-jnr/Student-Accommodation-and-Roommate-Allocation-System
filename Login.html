<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomly | Login</title>
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="landingpage.html">
      <span class="brand-mark">R</span>
      <span>Roomly <small>Accommodation and roommate allocation</small></span>
    </a>
    <nav class="nav-pills" aria-label="Main navigation">
      <a class="active" href="Login.html">Login</a>
      <a href="register.php">Register</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-panel">
      <form action="login_process.php" method="POST" class="auth-card" data-login-form>
        <div style="text-align: center;">
          <h1>Welcome Back!</h1>
          <p>We're glad to see you again.</p>
        </div>

        <div class="form-grid" style="margin-top: 24px;">
          <div class="field-full">
            <label for="email">Email address</label>
<input id="email" name="email" type="email" placeholder="student@example.com" required>
          </div>
          <div class="field-full">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required>
          </div>
          <div class="field-full">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="student">Student</option>
              <option value="landlord">Landlord</option>
              
            </select>
          </div>
        </div>

        <div class="button-row" style="margin-top: 22px;">
          <button class="button" type="submit">Login</button>
          <a class="button secondary" href="register.php">Create account</a>
        </div>
      </form>
    </section>

  </main>

  <script src="assets/js/app.js"></script>

</body>
</html>
