<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roommate Preferences | Roomly</title>
  <link rel="stylesheet" href="../assets/css/roommate.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="dashboard-shell">
    <aside class="sidebar">
      <h2 class="logo">Roomly<span class="dot">.</span></h2>

      <div class="nav-container">
        <span class="nav-heading">Student Menu</span>
        <nav class="nav-links" aria-label="Student navigation">
          <a href="dashboard.html">
            <i data-lucide="layout-dashboard"></i>
            Dashboard
          </a>
          <a href="hostels.html">
            <i data-lucide="search"></i>
            Search Hostels
          </a>
          <a class="active" href="Roommate.html">
            <i data-lucide="sliders"></i>
            Preferences
          </a>
          <a href="matchresults.html">
            <i data-lucide="sparkles"></i>
            Match Results
          </a>
          <a href="reviews.html">
            <i data-lucide="star"></i>
            Reviews
          </a>
        </nav>

        <span class="nav-heading">Account</span>
        <nav class="nav-links" aria-label="Account navigation">
          <a href="../Login.html" class="logout-link">
            <i data-lucide="log-out"></i>
            Logout
          </a>
        </nav>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="page-title">
          <div>
            <h1>Roommate preferences</h1>
            <p>Find your perfect living companion.</p>
          </div>
          </div>


      <!-- Interactive User Profile Widget -->
                <div class="user-profile-widget" onclick="window.location.href='profile.html'" title="View Profile">
                    <div class="profile-container">
                        <img src="" alt="Profile" class="profile-pic" id="header-avatar" style="display: none;">
                        <div class="profile-pic-fallback" id="header-fallback">AO</div>
                    </div>
                    <span class="username" id="header-name">Amina Otieno</span>
                </div>
      </header>

      <section class="page">
        <form class="panel">
          <div class="form-grid">
            <div class="field">
              <label for="room-type">Preferred Room Type</label>
              <select id="room-type">
                <option>Single</option>
                <option>Double</option>
                <option>Triple</option>
                <option>4-sharing</option>
              </select>
            </div>
            <div class="field">
              <label for="gender">Preferred roommate gender</label>
              <select id="gender">
                <option>Female</option>
                <option>Male</option>
                <option>No preference</option>
              </select>
            </div>
            <div class="field">
              <label for="budget">Individual budget per month (KES)</label>
              <input id="budget" type="number" placeholder="e.g. 45000">
            </div>
            <div class="field">
              <label for="study">Study style</label>
              <select id="study">
                <option>Quiet study environment</option>
                <option>Flexible study environment</option>
                <option>Group study friendly</option>
              </select>
            </div>
            <div class="field">
              <label for="sleep">Sleep schedule</label>
              <select id="sleep">
                <option>Early sleeper</option>
                <option>Late sleeper</option>
                <option>Flexible</option>
              </select>
            </div>
            <div class="field-full">
              <label for="lifestyle">Lifestyle preference</label>
              <textarea id="lifestyle" placeholder="Cleanliness, visitors, noise tolerance, study habits..."></textarea>
            </div>
          </div>
          <div class="button-row" style="margin-top: 20px;">
            <a class="button" href="match-results.html">Save preferences</a>
            <a class="button secondary" href="dashboard.html">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>
  
  <script src="../assets/js/roommate.js"></script>
  <script> lucide.createIcons(); </script>
  
  <script>
    // Sync Profile Data from localStorage (same as dashboard)
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('student-name');
            const savedAvatar = localStorage.getItem('student-avatar');

            if (savedName) {
                document.getElementById('header-name').innerText = savedName;
            }

            if (savedAvatar) {
                const avatarImg = document.getElementById('header-avatar');
                const fallback = document.getElementById('header-fallback');
                avatarImg.src = savedAvatar;
                avatarImg.style.display = 'block';
                fallback.style.display = 'none';
            }
        });
    </script>


</body>
</html>
